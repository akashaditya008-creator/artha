<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><style>[hidden]{display:none!important}</style><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Artha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#13201F; --muted:#5E716E; --line:#DCE5E2;
  --head:#0F3D3A; --head-ink:#EAF4F1; --head-muted:#9FC2BB;
  --accent:#F2A33A; --spend:#D9494E; --spend-soft:#FBE3E2; --ok:#2E8B6E;
  --chip:#E9F0EE; --scrim:rgba(10,24,22,.42);
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#151F1E; --ink:#E6EFEC; --muted:#93A8A4; --line:#25312F;
  --head:#0A2826; --head-ink:#E6F2EE; --head-muted:#86AAA2;
  --accent:#F5B158; --spend:#F07479; --spend-soft:#3A1E20; --ok:#5CC09E;
  --chip:#1D2928; --scrim:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#151F1E; --ink:#E6EFEC; --muted:#93A8A4; --line:#25312F;
  --head:#0A2826; --head-ink:#E6F2EE; --head-muted:#86AAA2;
  --accent:#F5B158; --spend:#F07479; --spend-soft:#3A1E20; --ok:#5CC09E;
  --chip:#1D2928; --scrim:rgba(0,0,0,.55); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:8px;
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.2px;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex}
.period{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:10px 2px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.period button{font-size:13px;color:var(--muted);padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.period button:disabled{opacity:.3;cursor:default}
.period .prev{text-align:left}.period .next{text-align:right}
.period .cur{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:.2px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;padding:0 16px;min-height:16px}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.live .dot{background:var(--ok)} .sync.warn .dot{background:var(--accent)}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.stage{touch-action:pan-y;user-select:none}
.stage svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.slot{cursor:pointer}
.slot .hit{fill:transparent}
.slot:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.ctr-l{font:600 10px var(--body);letter-spacing:1.6px;fill:var(--muted)}
.ctr-v{font-family:var(--display);font-weight:700;fill:var(--spend)}
.ctr-s{font:500 11px var(--body);fill:var(--muted)}
.pct{font:600 12.5px var(--body)}
.pill-row{display:grid;grid-template-columns:56px 1fr 66px;align-items:center;gap:8px;margin-top:6px}
.lines{height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.today{height:44px;display:grid;align-content:center;justify-items:center;gap:1px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);line-height:1.1}
.today small{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}.today b{font:600 14px var(--display)}
.tx{cursor:pointer}.tx:active{background:var(--chip)}
.esheet{position:fixed;inset:0;z-index:35;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.esheet .box{width:min(520px,100%);background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.esheet .t{font:600 17px var(--display)}.esheet .s{color:var(--muted);font-size:13.5px}
.esheet .go{padding:13px;border:0;border-radius:10px;background:var(--head);color:var(--head-ink);font:600 16px var(--body)}
.esheet .x{padding:12px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:500 15px var(--body)}
.card.sel{outline:2px solid var(--cc);outline-offset:-2px}
.lines svg{width:34px;height:20px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.lines[aria-pressed="true"]{background:var(--head);color:var(--head-ink);border-color:var(--head)}
.pill{background:var(--spend);color:#fff;border-radius:10px;padding:12px 14px;text-align:center;font-family:var(--display);font-size:19px;font-weight:600;
  box-shadow:0 2px 0 color-mix(in srgb,var(--spend) 60%,black)}
.pill small{font-family:var(--body);font-weight:500;font-size:13px;opacity:.9;margin-right:6px}
.ledger{margin-top:14px;display:grid;gap:2px}
.splits{display:grid;gap:10px;margin:14px 0 6px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.split .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px;gap:8px}
.split .lab b{color:var(--ink);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--chip);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.cat{border-bottom:1px solid var(--line)}
.cat>button{width:100%;display:grid;grid-template-columns:18px 40px 1fr auto;align-items:center;gap:8px;padding:12px 2px;text-align:left}
.chev{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.cat[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cic{width:36px;height:36px;display:grid;place-items:center}
.cic svg{width:30px;height:30px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:15.5px}
.cname span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--ok);color:#fff;font-size:11.5px;font-weight:600;border-radius:9px;padding:1px 7px;flex:none}
.amt{color:var(--spend);font-weight:600}
.amt sup{font-size:.62em;vertical-align:top;margin-left:1px;opacity:.75}
.txs{display:grid;padding:0 0 10px 58px}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.tx:first-child{border-top:0}
.tx .n{min-width:0;overflow-wrap:anywhere}
.tx .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:12px}
.chip{background:var(--chip);border-radius:6px;padding:1px 6px}
.chip.w{color:var(--accent)} .chip.nd{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:14px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:488px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end}
.fab{pointer-events:auto;display:grid;justify-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.fab .c{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:5px solid var(--spend);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.fab .c svg{width:34px;height:34px;stroke:var(--spend);stroke-width:4;stroke-linecap:round;fill:none}
.fab.sy .c{border-color:var(--ok)} .fab.sy .c svg{stroke:var(--ok);stroke-width:2.4}
.fab.sy.spin .c svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:21;background:var(--bg);overflow:auto;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;
  display:grid;gap:14px;align-content:start;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.drawer h2{margin:0;font-family:var(--display);font-size:18px}
.drawer label.k{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--surface)}
.seg button[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));font-weight:600}
.periods{display:grid;gap:8px}
.periods button{border:1.5px solid var(--line);border-radius:10px;padding:11px;font-size:15px;background:var(--surface)}
.periods button[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));font-weight:600}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dates input,.drawer input[type=date]{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:9px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.sheet{position:fixed;inset:0;z-index:22;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet .bar2{display:flex;gap:8px;align-items:center;padding-block:10px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.sheet .res{overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .sum{font-size:12.5px;color:var(--muted);padding:10px 0}
.res .tx{grid-template-columns:auto 1fr auto;align-items:start}
.res .tx .ic{width:26px;height:26px}
.res .tx .ic svg{width:24px;height:24px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.res .tx .m{grid-column:2/-1}
.add{position:fixed;inset:0;z-index:23;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.add .hd{display:flex;align-items:center;gap:6px;background:var(--head);color:var(--head-ink);padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.add .hd h2{margin:0;font:600 18px var(--display)}
.abody{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;max-width:520px;width:100%;margin:0 auto;box-sizing:border-box;
  padding-block:14px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.adate{position:relative;align-self:center;display:flex;align-items:center;gap:8px;font:500 17px var(--body);padding:6px 10px;border-radius:10px;cursor:pointer}
.adate svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.adate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.apanel{display:grid;grid-template-columns:72px 1fr 52px;align-items:stretch;background:var(--head);color:var(--head-ink);border-radius:12px;min-height:96px;box-shadow:0 2px 0 color-mix(in srgb,var(--head) 70%,black)}
.who{display:grid;align-content:center;justify-items:start;gap:2px;padding:0 10px;border-right:1px solid color-mix(in srgb,var(--head-ink) 30%,transparent);text-align:left;color:var(--head-ink)}
.who small{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--head-muted)}
.who b{font:600 15px var(--display)}
.aval{display:grid;place-items:center;font:500 46px var(--display);letter-spacing:.5px;overflow:hidden;white-space:nowrap;padding:0 6px}
.aval.long{font-size:28px}
.bk{display:grid;place-items:center;color:var(--head-ink)}
.bk svg{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.anote{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--line);padding:4px 2px}
.anote svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linejoin:round;flex:none}
.anote input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:8px 0;outline:none}
.achips{display:flex;flex-wrap:wrap;gap:8px 14px}
.seg.sm button{padding:6px 10px;font-size:13px;border-radius:8px}
.add .err{color:var(--spend);font-size:13.5px;min-height:0}
.add .err:empty{display:none}
.pad{margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pad button{height:min(9.5vh,72px);min-height:52px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font:400 30px var(--body);color:var(--ink)}
.pad button.op{font-size:28px;color:var(--muted)}
.pad button:active{background:var(--chip)}
.pad .choose{grid-column:1/-1;font:600 15px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink)}
.cgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start;margin:0 -2px;padding:2px}
.cgrid.two{grid-template-columns:1fr 1fr}
.card{display:grid;justify-items:center;align-content:center;gap:6px;min-height:104px;padding:10px 4px;border-radius:6px;background:var(--surface);
  border:1px solid var(--line);border-bottom:3px solid color-mix(in srgb,var(--cc) 55%,var(--line));font-size:13.5px;color:var(--cc);text-align:center;line-height:1.2}
.card svg{width:44px;height:44px;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.card span{color:color-mix(in srgb,var(--cc) 70%,var(--ink));font-weight:500}
.card:active{background:color-mix(in srgb,var(--cc) 10%,var(--surface))}
.card.busy{opacity:.55;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ .stage svg.in{animation:fi .28s ease-out} @keyframes fi{from{opacity:.25;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}} }
.gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px}
.gate form{display:grid;gap:12px;width:min(340px,100%)}.gate h2{margin:0;font:600 22px var(--display)}.gate p{margin:0;color:var(--muted)}
.gate input{font:inherit;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.gate button{font:600 16px var(--body);padding:12px;border:0;border-radius:10px;background:var(--head);color:var(--head-ink)}.gate .err{color:var(--spend);font-size:13.5px}

/* ===== iOS-style refresh: system type, grouped surfaces, frosted bars, gentle motion ===== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1C1C1E; --muted:#86868B; --line:rgba(60,60,67,.14);
  --tint:#0B7A6C; --head:#0B7A6C; --head-ink:#FFFFFF; --head-muted:rgba(255,255,255,.75);
  --accent:#F29A0E; --spend:#E5484D; --spend-soft:#FDE8E8; --ok:#2E9E66;
  --chip:rgba(118,118,128,.12); --scrim:rgba(0,0,0,.28); --bar:rgba(242,242,247,.78); --press:rgba(0,0,0,.05);
  --display:-apple-system,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:-apple-system,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --ink:#F2F2F7; --muted:#98989F; --line:rgba(84,84,88,.5);
  --tint:#3CCFB8; --head:#3CCFB8; --head-ink:#04211D; --head-muted:rgba(4,33,29,.7);
  --accent:#FFB340; --spend:#FF6B6E; --spend-soft:#3A1C1D; --ok:#45D483;
  --chip:rgba(118,118,128,.24); --scrim:rgba(0,0,0,.5); --bar:rgba(12,12,14,.78); --press:rgba(255,255,255,.07); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#F2F2F7; --muted:#98989F; --line:rgba(84,84,88,.5);
  --tint:#3CCFB8; --head:#3CCFB8; --head-ink:#04211D; --head-muted:rgba(4,33,29,.7);
  --accent:#FFB340; --spend:#FF6B6E; --spend-soft:#3A1C1D; --ok:#45D483;
  --chip:rgba(118,118,128,.24); --scrim:rgba(0,0,0,.5); --bar:rgba(12,12,14,.78); --press:rgba(255,255,255,.07); color-scheme:dark }
html{overscroll-behavior-y:contain}
html,body{margin:0}
.cname span:first-child{color:var(--ink)!important}
.cat .amt,.tx .amt{color:var(--ink)}
.tx .amt{font-weight:500}
body{font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
.frost{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
body::before{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header.top{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);
  border-bottom:.5px solid transparent;transition:border-color .25s ease;padding-block:6px}
body.scrolled header.top{border-bottom-color:var(--line)}
.ib{color:var(--tint);border-radius:50%;transition:background .2s,transform .15s}
.ib:hover{background:var(--chip)} .ib:active{transform:scale(.92)}
.ib.spin svg{animation:sp .9s linear infinite}
.brand h1{font:700 26px/1.12 var(--display);letter-spacing:-.025em;transition:font-size .3s var(--ease)}
body.scrolled .brand h1{font-size:18px}
.brand p{color:var(--muted);font-size:12.5px;transition:opacity .25s}
body.scrolled .brand p{opacity:.0;height:0;margin:0}
.period{padding-block:12px 0}
.period button{color:var(--tint);font-size:14px;font-weight:500}
.period .cur{font:600 17px var(--display);letter-spacing:-.02em;color:var(--ink)}
.sync{font-size:12px;padding-top:2px}
/* summary row: view switch · spent · today */
.pill-row{grid-template-columns:84px 1fr 76px;gap:10px;margin-top:4px}
.segv{display:grid;grid-template-columns:1fr 1fr;height:52px;padding:3px;border-radius:12px;background:var(--chip);box-sizing:border-box;position:relative}
.segv button{border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .25s var(--ease),color .2s,box-shadow .25s}
.segv button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.segv button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.pill{background:var(--surface);color:var(--ink);box-shadow:none;border-radius:14px;height:52px;padding:0 10px;display:grid;align-content:center;gap:1px;transition:transform .15s}
.pill small{display:block;margin:0;font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:1}
.pill span{font:700 21px var(--display);letter-spacing:-.02em;color:var(--spend)}
.today{height:52px;border:0;border-radius:14px;background:var(--surface);transition:transform .15s}
.today small{font-weight:600;letter-spacing:.06em;font-size:10.5px}
.today b{font:600 15px var(--display);letter-spacing:-.01em}
.pill:active,.today:active{transform:scale(.97)}
/* chart */
.ctr-l{font:600 10px var(--body);letter-spacing:.14em}
.ctr-v{font-family:var(--display);font-weight:700;fill:var(--ink);letter-spacing:-.02em}
.slot .hit{rx:12}
/* grouped ledger */
.ledger{gap:0;margin-top:16px}
.splits{border:0;border-radius:14px;margin:0 0 16px}
.bar{height:6px;border-radius:3px}
.cat{background:var(--surface);border-bottom:.5px solid var(--line)}
.splits+.cat{border-radius:14px 14px 0 0}
.cat:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.splits+.cat:last-child{border-radius:14px}
.cat>button{padding:12px 14px 12px 10px;transition:background .15s}
.cat>button:active{background:var(--press)}
.chev{transition:transform .3s var(--ease)}
.cname{font-weight:600;font-size:16px;letter-spacing:-.01em}
.badge{background:var(--chip);color:var(--muted);font-weight:600}
.txs{padding:0 0 6px 50px;animation:txin .32s var(--ease)}
@keyframes txin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.chip{border-radius:6px;background:var(--chip)}
/* entries + swipe-to-edit */
.txw{position:relative;overflow:hidden}
.txw+.txw .tx{border-top:.5px solid var(--line)}
.tx{position:relative;z-index:1;background:var(--surface);border-top:0;padding:10px 14px 10px 0;transition:transform .35s var(--ease),background .15s;touch-action:pan-y}
.tx:active{background:var(--surface)}
.txa{position:absolute;top:0;bottom:0;right:0;width:84px;background:var(--tint);color:var(--head-ink);font:600 15px var(--body);display:grid;place-items:center}
.txw.open .tx{transform:translateX(-84px)}
.res .tx{background:var(--bg);padding-right:4px}
/* bottom bar: one clear action */
.dock{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:auto}
.dock .in{display:block}
.addb{width:100%;height:50px;border-radius:14px;background:var(--tint);color:var(--head-ink);font:600 17px var(--body);letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .15s}
.addb svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.addb:active{transform:scale(.97);filter:brightness(.95)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
/* pull to refresh */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:6;width:34px;height:34px;margin-left:-17px;border-radius:50%;
  background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;opacity:var(--p,0);transform:translateY(calc(var(--p,0) * 18px)) rotate(calc(var(--p,0) * 300deg));pointer-events:none}
.ptr svg{width:18px;height:18px;stroke:var(--tint);fill:none;stroke-width:2.2;stroke-linecap:round}
/* sheets */
.scrim{background:var(--scrim)}
.drawer{background:var(--bg);box-shadow:8px 0 40px rgba(0,0,0,.18)}
.drawer h2{font:700 22px var(--display);letter-spacing:-.02em}
.seg{gap:6px}
.seg button{border:0;border-radius:999px;padding:8px 14px;background:var(--chip);font-weight:500;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--tint);color:var(--head-ink);font-weight:600}
.periods{gap:0;border-radius:14px;overflow:hidden;background:var(--surface)}
.periods button{border:0;border-radius:0;border-bottom:.5px solid var(--line);text-align:left;padding:13px 16px;background:var(--surface);display:flex;justify-content:space-between}
.periods button:last-child{border-bottom:0}
.periods button[aria-pressed="true"]{background:var(--surface);color:var(--tint);font-weight:600}
.periods button[aria-pressed="true"]::after{content:"✓"}
.dates input,.drawer input[type=date]{border:0;border-radius:12px;background:var(--surface)}
.sheet .bar2{border-bottom:.5px solid var(--line);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.sheet .bar2 .ib svg{stroke:var(--tint)!important}
.sheet input{border:0;border-radius:10px;background:var(--chip);padding:10px 12px}
.esheet{background:var(--scrim)}
.esheet .box{background:var(--bg);border-radius:16px 16px 0 0;padding-top:8px;gap:12px}
.esheet .box::before{content:"";justify-self:center;width:36px;height:5px;border-radius:3px;background:var(--line);margin-bottom:4px}
.esheet .t{font:600 18px var(--display);letter-spacing:-.02em}
.esheet .go{background:var(--tint);color:var(--head-ink);border-radius:14px;padding:14px}
.esheet .x{border:0;background:var(--surface);border-radius:14px;padding:14px;color:var(--tint);font-weight:600}
/* add / edit expense */
.add .hd{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);border-bottom:.5px solid var(--line)}
.add .hd .ib{color:var(--tint)}
.add .hd h2{font:600 17px var(--display);letter-spacing:-.02em}
.adate{font:500 16px var(--body);color:var(--tint)} .adate svg{stroke:var(--tint)}
.apanel{background:var(--surface);color:var(--ink);box-shadow:none;border-radius:16px;min-height:92px}
.who{border-right:.5px solid var(--line);color:var(--ink)}
.who small{color:var(--muted)} .who b{color:var(--tint);font-weight:600}
.aval{font:300 46px var(--display);letter-spacing:-.03em}
.aval.long{font-size:30px}
.bk{color:var(--muted)}
.anote{border-bottom:.5px solid var(--line)}
.pad{gap:8px}
.pad button{border:0;border-radius:12px;background:var(--surface);font:400 28px var(--display);transition:transform .12s,background .12s}
.pad button.op{color:var(--tint);font-size:26px}
.pad button:active{transform:scale(.95);background:var(--chip)}
.pad .choose{background:var(--tint);color:var(--head-ink);font:600 16px var(--body);letter-spacing:0;text-transform:none}
.cgrid{gap:10px}
.card{border:0;border-radius:16px;background:var(--surface);gap:8px;min-height:108px;transition:transform .15s,box-shadow .2s;animation:cardin .35s var(--ease) both}
.card svg{width:54px;height:54px;padding:12px;box-sizing:border-box;border-radius:50%;background:color-mix(in srgb,var(--cc) 13%,transparent)}
.card span{color:var(--ink);font-weight:500;font-size:13px}
.card:active{transform:scale(.96);background:var(--surface)}
.card.sel{outline:0;box-shadow:inset 0 0 0 2px var(--cc)}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:14px;
  bottom:calc(88px + env(safe-area-inset-bottom,0px));animation:toastin .45s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.gate form{justify-items:stretch;text-align:center}
.gate .logo{width:72px;height:72px;border-radius:18px;justify-self:center;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.gate input{border:0;border-radius:12px;background:var(--surface);text-align:center}
.gate button{background:var(--tint);color:var(--head-ink);border-radius:14px;padding:14px}
/* cues: say what a tap will do */
.ib.cap{width:auto;min-width:46px;height:48px;border-radius:12px;display:grid;justify-items:center;align-content:center;gap:1px;padding:0 4px;color:var(--tint);text-decoration:none}
.ib.cap svg{width:21px;height:21px}
.ib.cap i{font:500 10px var(--body);font-style:normal;letter-spacing:.01em;color:var(--muted)}
header.top{grid-template-columns:auto 1fr auto}
.period .cur::after{content:" ▾";font-size:11px;color:var(--muted);vertical-align:1px}
.pill-row{grid-template-columns:132px 1fr 80px}
.segv{cursor:pointer}
.segv button{display:flex;align-items:center;justify-content:center;gap:5px;font:600 13px var(--body);letter-spacing:-.01em}
.segv button svg{width:17px;height:17px}
.today small::after{content:" ›";letter-spacing:0}
.hint{margin:10px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.ledger .hint{margin:14px 0 4px}
.tx .amt::after{content:"›";margin-left:8px;color:var(--muted);font-weight:400;opacity:.7}
.chip.sync{color:var(--tint);background:color-mix(in srgb,var(--tint) 14%,transparent)}
.dhead{display:flex;align-items:center;justify-content:space-between}
.done{color:var(--tint);font:600 16px var(--body);padding:8px 4px}
.ver{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);border-top:.5px solid var(--line);padding-top:12px;order:99}
.ver button{color:var(--tint);font-weight:600;font-size:13px}
.drawer{display:flex;flex-direction:column;gap:16px}
.who b::after{content:" ⇄";font-weight:400;font-size:12px;color:var(--muted)}
.adate span::after{content:" ▾";font-size:11px;color:var(--muted)}
.add .hint{margin:0}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;align-items:center;gap:12px;
  padding:8px 8px 8px 16px;border-radius:999px;background:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.16);font-size:13.5px;white-space:nowrap;max-width:calc(100vw - 32px)}
.upd span{overflow:hidden;text-overflow:ellipsis}
.upd button{background:var(--tint);color:var(--head-ink);font-weight:600;border-radius:999px;padding:7px 14px;flex:none}
.eamt{font:700 34px var(--display);letter-spacing:-.03em;color:var(--spend)}
.esheet .t{font:500 16px var(--body);color:var(--ink)}
.elist{margin:0;display:grid;grid-template-columns:auto 1fr;background:var(--surface);border-radius:14px;overflow:hidden}
.elist dt,.elist dd{margin:0;padding:11px 14px;border-bottom:.5px solid var(--line);font-size:14px}
.elist dt{color:var(--muted)} .elist dd{text-align:right;color:var(--ink)}
.elist dt:nth-last-of-type(1),.elist dd:last-of-type{border-bottom:0}
.ecat{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.ecat svg{width:18px;height:18px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.esheet .s{font-size:12px;text-align:center}
.esheet .box{max-height:88vh;overflow:auto}
@media (prefers-reduced-motion:no-preference){ .upd:not([hidden]){animation:toastin .5s var(--ease)} }

/* ----- add screen: labels, bigger note, numbers-only pad ----- */
.anote{align-items:flex-start;gap:10px;background:var(--surface);border:0;border-radius:14px;padding:12px 14px;cursor:text}
.anote svg{margin-top:2px}
.anote textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 17px/1.4 var(--body);resize:none;outline:none;padding:0;min-height:48px}
.anote textarea::placeholder{color:var(--muted)}
.aopts{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px 12px}
.aopts .k{font:600 10.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pad{grid-template-columns:repeat(3,minmax(0,1fr))}
.pad button{font-size:30px}
.pad button.op{display:grid;place-items:center;color:var(--muted)}
.pad button.op svg{width:30px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
/* ----- theme picker ----- */
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skins button{display:grid;justify-items:center;gap:6px;padding:10px 4px 8px;border-radius:14px;background:var(--surface);font:500 12.5px var(--body);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s,transform .15s}
.skins button:active{transform:scale(.96)}
.skins button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tint);font-weight:600}
.sw{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%);box-shadow:0 0 0 1px rgba(128,128,128,.25);position:relative}
.sw::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--t)}
html.skinning *{transition:background-color .4s ease,color .4s ease,border-color .4s ease!important}
/* ----- flagship themes (chosen in View → Theme; Auto follows the phone) ----- */
:root[data-skin="simple"]{--bg:#F2F2F7;--surface:#FFFFFF;--ink:#1C1C1E;--muted:#86868B;--line:rgba(60,60,67,.14);--tint:#0B7A6C;--head:#0B7A6C;--head-ink:#FFFFFF;--head-muted:rgba(255,255,255,.75);
  --accent:#F29A0E;--spend:#E5484D;--spend-soft:#FDE8E8;--ok:#2E9E66;--chip:rgba(118,118,128,.12);--scrim:rgba(0,0,0,.28);--bar:rgba(242,242,247,.78);--press:rgba(0,0,0,.05);color-scheme:light}
:root[data-skin="batman"]{--bg:#000000;--surface:#1C1C1E;--ink:#F2F2F7;--muted:#98989F;--line:rgba(84,84,88,.5);--tint:#3CCFB8;--head:#3CCFB8;--head-ink:#04211D;--head-muted:rgba(4,33,29,.7);
  --accent:#FFB340;--spend:#FF6B6E;--spend-soft:#3A1C1D;--ok:#45D483;--chip:rgba(118,118,128,.24);--scrim:rgba(0,0,0,.5);--bar:rgba(12,12,14,.78);--press:rgba(255,255,255,.07);color-scheme:dark}
:root[data-skin="blossom"]{--bg:#FFF4F6;--surface:#FFFFFF;--ink:#2B1B22;--muted:#9A7F88;--line:rgba(150,60,90,.14);--tint:#D2497C;--head:#D2497C;--head-ink:#FFFFFF;--head-muted:rgba(255,255,255,.8);
  --accent:#E89A3C;--spend:#D2385A;--spend-soft:#FCE4EA;--ok:#3E9C6F;--chip:rgba(210,73,124,.10);--scrim:rgba(60,20,35,.3);--bar:rgba(255,244,246,.82);--press:rgba(210,73,124,.06);color-scheme:light}
:root[data-skin="midnight"]{--bg:#0A1020;--surface:#131B2E;--ink:#E8EDF7;--muted:#8B97AE;--line:rgba(140,160,200,.18);--tint:#6EA8FF;--head:#6EA8FF;--head-ink:#06122A;--head-muted:rgba(6,18,42,.7);
  --accent:#FFC266;--spend:#FF7A85;--spend-soft:#3A1E28;--ok:#4FD1A0;--chip:rgba(120,140,190,.18);--scrim:rgba(0,0,0,.5);--bar:rgba(10,16,32,.8);--press:rgba(255,255,255,.06);color-scheme:dark}
:root[data-skin="sage"]{--bg:#F3F4EE;--surface:#FFFFFF;--ink:#1F2A1E;--muted:#7C8676;--line:rgba(70,90,60,.15);--tint:#4F7A3F;--head:#4F7A3F;--head-ink:#FFFFFF;--head-muted:rgba(255,255,255,.8);
  --accent:#D08A2E;--spend:#C4473D;--spend-soft:#F6E3E0;--ok:#4F8A4F;--chip:rgba(79,122,63,.10);--scrim:rgba(30,40,25,.3);--bar:rgba(243,244,238,.82);--press:rgba(79,122,63,.06);color-scheme:light}
/* app-like: no text selection / copy menu on long-press, except where you type */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* moving category tiles */
.cgrid .card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.cgrid.sorting .card{animation:none}
.cgrid.sorting .card:active{transform:none}
.card.lift{z-index:5;pointer-events:none;will-change:transform;box-shadow:0 16px 36px rgba(0,0,0,.32),inset 0 0 0 2px var(--tint);opacity:.82}
.card.drop-swap{box-shadow:inset 0 0 0 2px var(--tint);background:color-mix(in srgb,var(--tint) 12%,var(--surface))}
.card.drop-swap::after{content:"⇄ swap";position:absolute;top:6px;right:8px;font:600 10px var(--body);color:var(--tint)}
.card.drop-before::before,.card.drop-after::before{content:"";position:absolute;top:12%;bottom:12%;width:4px;border-radius:2px;background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 25%,transparent)}
.card.drop-before::before{left:-7px} .card.drop-after::before{right:-7px}
/* motion — only when the phone allows it */
@media (prefers-reduced-motion:no-preference){
  .stage svg.in,.ledger.in{animation:slidein .38s var(--ease)}
  @keyframes slidein{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
  .stage svg.draw .segc{stroke-dasharray:1 1;animation:draw .9s var(--ease) both}
  .stage svg.draw .slot,.stage svg.draw line{animation:fadein .5s .35s ease both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .add:not([hidden]),.sheet:not([hidden]){animation:sheetup .45s var(--ease)}
  @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
  .esheet:not([hidden]){animation:fadein .25s ease} .esheet:not([hidden]) .box{animation:sheetup .42s var(--ease)}
  .scrim:not([hidden]){animation:fadein .25s ease} .drawer:not([hidden]){animation:drawerin .4s var(--ease)}
  @keyframes drawerin{from{transform:translateX(-100%)}to{transform:none}}
  .gate:not([hidden]) form{animation:cardin .5s var(--ease)}
}
@media (prefers-reduced-motion:reduce){ .card,.txs,.toast{animation:none} .tx{transition:none} }

/* ===================== Artha on the Kharcha design ===================== */
.hl .av svg,.choice .av svg{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ocard,.sumc,.chartc,.grp,.emptyc,.banner,.brow,.hl{box-sizing:border-box}
.gain{color:var(--ok)!important}.loss{color:var(--spend)!important}
.ib svg.i,.ib.cap svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* person switch under the title */
.whos{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:12px;background:var(--chip);margin:12px max(16px,env(safe-area-inset-left,0px)) 0}
.whos button{height:34px;border-radius:9px;font:600 13.5px var(--body);color:var(--muted);transition:background .25s var(--ease),color .2s}
.whos button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scr .whos{margin:4px 0 12px}
/* due banner */
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:14px;padding:12px 14px;margin:10px 0 2px}
.banner svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner b{display:block;font-weight:600}.banner small{color:var(--muted);font-size:12.5px}
.banner .go2{color:var(--tint);font-weight:600;font-size:14px}
/* category list on home (Kharcha .cat rows) */
.cat .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.cat .amt small{display:block;text-align:right;font-size:12px;font-weight:500}
.cat>button{grid-template-columns:18px 40px 1fr auto}
.hl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 14px 10px 0;border-top:.5px solid var(--line)}
.hl:first-child{border-top:0}

</style>

<script>
(()=>{
"use strict";
const APP_VERSION="1.3";
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem("artha:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("artha:"+k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SUM=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const splitPr=v=>{ const i=v.lastIndexOf("|"); return [v.slice(0,i),v.slice(i+1)]; };

/* ---------- endpoint (only from the private setup link) ---------- */
function takeLink(s){ const m=/[#&?]k=([\w-]{20,})/.exec(s||"")||/\/macros\/s\/([\w-]{20,})\//.exec(s||""); if(!m) return false; store.set("api","https://script.google.com/macros/s/"+m[1]+"/exec"); return true; }
if(takeLink(location.hash)) history.replaceState(null,"",location.pathname+location.search);
const API=()=>store.get("api",""), PW=()=>store.get("pass","");
function call(action,extra){
  return fetch(API(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,pass:PW()},extra||{}))})
    .then(r=>r.json(),()=>{ const x=new Error("Couldn't reach Google just now. Check your internet."); x.net=true; throw x; })
    .then(r=>{ if(r&&r.ok) return r.d; throw new Error((r&&r.m)||"Couldn't reach the sheet."); });
}

/* ---------- dates & money ---------- */
const pad2=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const TODAY=()=>isoOf(new Date());
const dOf=s=>new Date(s+"T00:00:00");

function xirr(flows){
  const f=flows.filter(x=>x[0]&&x[1]).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  if(f.length<2||!f.some(x=>x[1]>0)||!f.some(x=>x[1]<0)) return null;
  const t0=dOf(f[0][0]).getTime(), g=f.map(x=>[(dOf(x[0]).getTime()-t0)/864e5/365,x[1]]);
  if(g[g.length-1][0]<0.02) return null;
  const npv=r=>g.reduce((s,x)=>s+x[1]/Math.pow(1+r,x[0]),0);
  let lo=-0.9999,hi=10,flo=npv(lo),fhi=npv(hi);
  for(let k=0;k<60&&flo*fhi>0;k++){ hi*=2; fhi=npv(hi); if(hi>1e6) return null; }
  if(flo*fhi>0) return null;
  for(let k=0;k<200;k++){ const m=(lo+hi)/2,fm=npv(m); if(Math.abs(fm)<1e-7||hi-lo<1e-10) return m; if(fm*flo<0){hi=m;fhi=fm;} else {lo=m;flo=fm;} }
  return (lo+hi)/2;
}

}

function unitHist(u){ const c=M.tabs.find(t=>t.name===u.tab); if(!c) return [];
  const us=M.units.filter(x=>x.tab===u.tab), prim=us.length===1?us[0]:(us.find(x=>x.a==="Stocks")||us.slice().sort((x,y)=>y.net-x.net)[0]);
  const H=[]; if(u===prim){ const oc=SUM(us.filter(x=>x!==u),x=>x.a==="Bonds"?0:Math.max(0,x.net)); c.V.forEach(v=>H.push({d:v.date,v:v.value-oc})); }
  if(u.src==="holdings") H.push({d:u.asof,v:u.valAt});
  return H.sort((a,b)=>a.d<b.d?-1:1); }
function series(U){ /* invested (net) over time and value points */
  const T=[].concat(...U.map(u=>u.T)).filter(t=>t.date).sort((a,b)=>a.date<b.date?-1:1);
  const inv=[]; let c=0; T.forEach(t=>{ c+=t.amt; if(inv.length&&inv[inv.length-1].d===t.date) inv[inv.length-1].v=c; else inv.push({d:t.date,v:c}); });
  const hs=U.map(u=>({u,H:unitHist(u)})), dates=[...new Set([].concat(...hs.map(x=>x.H.map(p=>p.d))))].sort();
  const netAt=(u,D)=>SUM(u.T.filter(t=>t.date&&t.date<=D),t=>t.amt);
  const val=dates.map(D=>({d:D,v:SUM(hs,({u,H})=>{ const p=H.filter(q=>q.d<=D).pop(); return p?p.v+SUM(u.T.filter(t=>t.date&&t.date>p.d&&t.date<=D),t=>t.amt):Math.max(0,netAt(u,D)); })}));
  if(val.length){ const cur=SUM(U,u=>u.cur); if(val[val.length-1].d<M.today) val.push({d:M.today,v:cur,now:1}); }
  return {T,inv,val};
}

function arc(a0,a1){ const [x0,y0]=ptc(RM,a0),[x1,y1]=ptc(RM,a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${RM} ${RM} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
const cd=(a,b)=>{const d=((a-b)%360+360)%360;return Math.min(d,360-d);};
function attach(g,ang){ const pad=Math.min(4,(g.a1-g.a0)/2), lo=g.a0+pad, hi=g.a1-pad; let best=g.mid,bd=1e9; for(const k of [-360,0,360]){ const t=Math.max(lo,Math.min(hi,ang+k)); const d=Math.abs(t-(ang+k)); if(d<bd){bd=d;best=t;} } return best; }
function assign(cats){ const N=cats.length,Mm=SLOTS.length; const dp=Array.from({length:N+1},()=>Array(Mm+1).fill(Infinity)), ch=Array.from({length:N+1},()=>Array(Mm+1).fill(0));
  for(let j=0;j<=Mm;j++) dp[0][j]=0;
  for(let i=1;i<=N;i++) for(let j=i;j<=Mm;j++){ const g=cats[i-1], s=SLOTS[j-1], d=cd(attach(g,s.ang),s.ang); const skip=dp[i][j-1], take=dp[i-1][j-1]+d*d+.05*cd(g.mid,s.ang); if(take<=skip){dp[i][j]=take;ch[i][j]=1;} else dp[i][j]=skip; }
  const res=Array(N); let i=N,j=Mm; while(i>0){ if(ch[i][j]){res[i-1]=SLOTS[j-1];i--;j--;} else j--; } return {res,cost:dp[N][Mm]}; }
function layout(gs,total){ let best=null;
  for(let st=0;st<360;st+=6){ let a=st; const segs=gs.map(g=>{const s={...g,a0:a,a1:a+(total?g.sum/total*360:0)}; s.mid=(s.a0+s.a1)/2; a=s.a1; return s;});
    const segsN=segs.map(s=>({...s,mid:((s.mid%360)+360)%360})), rot=[...segsN].sort((x,y)=>x.mid-y.mid).map(s=>segs[segsN.indexOf(s)]);
    const {res,cost}=assign(rot.map(s=>({...s}))); if(!best||cost<best.cost) best={cost,order:rot,sl:res}; }
  best.order.forEach((g,i)=>{ g.att=attach(g,best.sl[i].ang); }); return best; }
function homeGroups(){ return HOME.map(h=>({h,r:agg(h,WHO)})).filter(x=>x.r.cur>0||x.r.U.length); }
function drawRing(){
  const G=homeGroups().filter(x=>x.r.cur>0), total=SUM(G,x=>x.r.cur), st=$("stage");
  const gains=homeGroups().map(x=>x.r).filter(r=>r.gain!=null);
  let svg=`<svg viewBox="0 0 360 400" role="img" aria-label="Your money by category">`;
  svg+=`<circle cx="${CX}" cy="${CY}" r="${RM}" fill="none" stroke="var(--line)" stroke-width="${RO-RI}"/>`;
  if(G.length){ const {order,sl}=layout(G.map(x=>({c:x.h,sum:x.r.cur})),total);
    if(order.length===1) svg+=`<circle cx="${CX}" cy="${CY}" r="${RM}" fill="none" stroke="${CLS[order[0].c].col}" stroke-width="${RO-RI}" data-c="${order[0].c}" class="segc" pathLength="1" transform="rotate(-90 ${CX} ${CY})"/>`;
    else order.forEach(g=>{ if(g.a1-g.a0<.05) return; const gap=Math.min(.6,(g.a1-g.a0)/4); svg+=`<path d="${arc(g.a0+gap,g.a1-gap)}" fill="none" stroke="${CLS[g.c].col}" stroke-width="${RO-RI}" class="segc" data-c="${g.c}" pathLength="1"></path>`; });
    order.forEach((g,i)=>{ const s=sl[i], col=CLS[g.c].col; const [ex,ey]=ptc(RO+3,g.att); const dx=ex-s.x,dy=ey-s.y,L=Math.hypot(dx,dy)||1, stp=s.k==='s'?20:19;
      svg+=`<line x1="${(s.x+dx/L*stp).toFixed(1)}" y1="${(s.y+dy/L*stp).toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${col}" stroke-width="1" opacity=".55"/>`;
      const p=total?g.sum/total*100:0, pt_=p<1?"<1%":Math.round(p)+"%", ty=s.k==='t'?s.y-24:s.y+31;
      svg+=`<g class="slot" tabindex="0" role="button" data-c="${g.c}" aria-label="${CLS[g.c].label}, ${pt_}"><rect class="hit" x="${s.x-34}" y="${Math.min(s.y-20,ty-14)}" width="68" height="${Math.abs(ty-s.y)+38}" rx="10"/>
        <g transform="translate(${s.x-16} ${s.y-16}) scale(1.333)" fill="none" stroke="${col}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="${P[CLS[g.c].icon]}"/></g>
        <text class="pct num" x="${s.x}" y="${ty}" text-anchor="middle" fill="${col}">${pt_}</text><text class="ctr-s" x="${s.x}" y="${s.k==='t'?ty-14:ty+14}" text-anchor="middle">${CLS[g.c].label}</text></g>`; }); }
  const big=HIDE?"₹••••":rs(total,false), fs=big.length>11?18:big.length>9?21:24, g=SUM(gains,r=>r.gain);
  svg+=`<text class="ctr-l" x="${CX}" y="${CY-24}" text-anchor="middle">WORTH</text><text class="ctr-v num" x="${CX}" y="${CY+5}" text-anchor="middle" font-size="${fs}">${esc(big)}</text>`;
  svg+=`<text class="ctr-s num" x="${CX}" y="${CY+28}" text-anchor="middle" fill="${g>0?"var(--ok)":g<0?"var(--spend)":"var(--muted)"}" style="fill:${g>0?"var(--ok)":g<0?"var(--spend)":"var(--muted)"}">${DATA?(gains.length?(HIDE?"":esc((g>0?"+":"")+rs(g,true))+" gain"):"Add values to see gain"):"Loading…"}</text></svg>`;
  st.innerHTML=svg; const el=st.firstChild; const key=total+"|"+WHO; if(key!==drawRing.key){ drawRing.key=key; if(DATA) el.classList.add("draw"); }
  st.querySelectorAll(".slot,.segc").forEach(n=>{ const go=()=>openScr(n.dataset.c); n.addEventListener("click",go); n.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } }); });
}
function catLines(h,who,max){ /* the few lines shown under a category in the list */
  if(h==="Stocks"||h==="Mutual Funds"){ const H=holdFor(h,who).slice().sort((a,b)=>b.cur-a.cur); if(H.length) return {n:H.length,html:H.slice(0,max).map(holdRow).join("")};
    if(h==="Mutual Funds"){ const F=fundsFromOrders(who); return {n:F.length,html:F.slice(0,max).map(fundOrderRow).join("")}; }
    return {n:0,html:`<div class="hl" style="grid-template-columns:1fr"><span class="m" style="white-space:normal">Upload your Groww holdings statement to see the stocks you hold today.</span></div>`}; }
  if(h==="Bonds"){ const L=bondsFor(who).filter(b=>!b.closed); return {n:L.length,html:L.slice(0,max).map(bondRow).join("")}; }
  const L=otherItems(who); return {n:L.length,html:L.map(o=>`<button class="hl" data-oth="${o.k}"><span class="av" style="background:${CLS[o.k].col}">${svgI(CLS[o.k].icon,"#fff",18)}</span><div style="min-width:0"><div class="n">${o.t}</div><div class="m">${o.m}</div></div><div class="r"><b class="num">${money(o.v,true)}</b><small class="${o.c||""}">${o.s}</small></div></button>`).join("")};
}

      <span class="cname"><span>${c.label}<span class="sub">${tot?Math.round(r.cur/tot*100):0}% of your money</span></span>${L.n?`<span class="badge num">${L.n}</span>`:""}</span>
      <span class="amt num">${money(r.cur,true)}${r.gain!=null?`<small class="${cls(r.gain)}">${smoney(r.gain,true)}${gp!=null?" · "+pct(gp):""}</small>`:""}</span></button>

function holdRow(h){ const gp=h.inv>0?h.gain/h.inv:null, isMF=h.a==="Mutual Funds";
  const meta=[h.qty?(isMF?qtyf(h.qty)+" units":qtyf(h.qty)+" shares"):"", h.avg&&!isMF?"avg "+rs(h.avg,false):"", WHO==="all"?h.who:""].filter(Boolean).join(" · ")||esc(h.plat);
  return `<button class="hl" data-hold="${h.i}"><span class="av" style="background:${h.col||avColor(h.name)}">${esc(initials(h.name))}</span><div style="min-width:0"><div class="n">${esc(h.name)}</div><div class="m">${esc(meta)}</div></div>
    <div class="r"><b class="num">${money(h.cur,true)}</b><small class="${cls(h.gain)}">${h.inv?smoney(h.gain,true)+(gp!=null?" · "+pct(gp):""):""}</small></div></button>`; }
function fundsFromOrders(who){ const m=new Map(); txFor("Mutual Funds",who).forEach(t=>{ const nm=t.name||"Mutual fund", id=t.who+"|"+nm; const f=m.get(id)||{id,name:nm,who:t.who,T:[],net:0,n:0}; f.T.push(t); f.net+=t.amt; if(t.amt>0) f.n++; m.set(id,f); });
  return [...m.values()].filter(f=>f.net>1).sort((a,b)=>b.net-a.net); }
const fundOrderRow=f=>`<button class="hl" data-fund="${esc(f.id)}"><span class="av" style="background:${avColor(f.name)}">${esc(initials(f.name))}</span><div style="min-width:0"><div class="n">${esc(f.name)}</div><div class="m">${f.n} order${f.n===1?"":"s"}${WHO==="all"?" · "+f.who:""}</div></div><div class="r"><b class="num">${money(f.net,true)}</b><small>invested</small></div></button>`;
function bondRow(b){ const pr=b.exp>0?Math.min(1,b.repaid/b.exp):(b.closed?1:0), due=b.next&&b.next.d<=M.today;
  return `<button class="brow" data-bond="${esc(b.key)}"><div class="a"><span class="n">${esc(b.name)}</span><span class="v num">${money(b.cost,true)}</span></div>
    <div class="m"><span>${esc(b.platL)}${WHO==="all"?" · "+b.who:""}</span><span>${b.closed?`<span class="tag ok">Repaid</span>`:due?`<span class="tag due">Due ${fmtDs(b.next.d)}</span>`:b.next?"Next "+fmtDs(b.next.d)+(b.next.a?" · "+money(b.next.a,true):""):"No date"}</span></div>
    <div class="prog"><i style="width:${(pr*100).toFixed(1)}%;background:${b.closed?"var(--ok)":"var(--tint)"}"></i></div></button>`; }
function otherItems(who){ const L=[], r=agg("Others",who);
  if(r.U.length){ const gp=r.gain!=null&&r.base>0?r.gain/r.base:null; L.push({k:"NPS",t:"NPS",m:r.asof?"Value "+fmtDs(r.asof):"No value yet · at cost",v:r.cur,s:r.gain!=null?smoney(r.gain,true)+(gp!=null?" · "+pct(gp):""):"invested",c:cls(r.gain)}); }
  const tc=M.term; if(tc&&tc.T.length&&okWho("Aditya",who)){ const np=nextPremium(tc); L.push({k:"Term",t:"Term insurance",m:`${tc.T.length} of 60 paid${np?" · next "+fmtDs(np.date):""}`,v:SUM(tc.T,t=>t.amt),s:"paid, not in worth"}); }
  return L; }
function txRow(t){ const c=CLS[t.a]||CLS.Stocks;

function doAct(a){

function loadXLSX(){ if(window.XLSX) return Promise.resolve(); return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=ok; s.onerror=()=>bad(new Error("Couldn't load the file reader. Check your internet.")); document.head.appendChild(s); }); }
async function readTable(f){ if(/\.csv$/i.test(f.name)){ const t=await f.text(); return t.split(/\r?\n/).map(l=>{ const o=[]; let c="",q=false; for(const ch of l){ if(q){ if(ch==='"') q=false; else c+=ch; } else if(ch==='"') q=true; else if(ch===','){ o.push(c); c=""; } else c+=ch; } o.push(c); return o; }); }
  await loadXLSX(); const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); let best=[];
  wb.SheetNames.forEach(n=>{ const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""}); if(r.length>best.length) best=r; }); return best; }
function parseHoldings(R){
  const s=x=>String(x==null?"":x).trim(), lc=x=>s(x).toLowerCase();
  const num=x=>{ if(typeof x==="number") return x; const t=s(x).replace(/[₹,\s]/g,""); const n=parseFloat(t); return isFinite(n)?n:NaN; };
  let hi=-1, C={};
  for(let i=0;i<Math.min(R.length,60);i++){ const row=R[i].map(lc); const find=re=>row.findIndex(c=>re.test(c));
    const name=find(/^(stock name|scheme name|company name|security name|instrument|symbol|fund name|scheme|stock|name)$/)>=0?find(/^(stock name|scheme name|company name|security name|instrument|symbol|fund name|scheme|stock|name)$/):find(/(stock|scheme|company|security|fund) name/);
    const val=find(/current value|closing value|market value|present value|value as on|current amount/);
    if(name>=0&&(val>=0||find(/quantity|units|qty/)>=0)){ hi=i; C={name,isin:find(/isin/),qty:find(/^(quantity|qty|units|balance units|no\.? of units|shares)/),avg:find(/avg|average/),inv:find(/invested|buy value|investment|cost value|purchase value|amount invested/),cur:val,price:find(/closing price|ltp|current price|market price|^nav|current nav|price as on/)}; break; } }
  if(hi<0) return {rows:[]};
  const head=R[hi].map(lc).join(" "), asset=/scheme|units|nav|folio|amc|fund/.test(head)?"Mutual Funds":"Stocks";
  const out=[];
  for(let i=hi+1;i<R.length;i++){ const r=R[i], name=s(r[C.name]); if(!name){ if(out.length) break; continue; } if(/^total|grand total/i.test(name)) break;
    const g=k=>C[k]>=0?num(r[C[k]]):NaN; let qty=g("qty"), avg=g("avg"), inv=g("inv"), cur=g("cur"); const price=g("price");
    if(!isFinite(cur)&&isFinite(qty)&&isFinite(price)) cur=qty*price; if(!isFinite(inv)&&isFinite(qty)&&isFinite(avg)) inv=qty*avg; if(!isFinite(avg)&&isFinite(inv)&&qty>0) avg=inv/qty;
    if(!isFinite(cur)) continue; out.push({name,isin:C.isin>=0?s(r[C.isin]):"",qty:isFinite(qty)?qty:0,avg:isFinite(avg)?avg:0,inv:isFinite(inv)?inv:0,cur}); }
  let date=""; const top=R.slice(0,hi).map(r=>r.map(s).join(" ")).join(" ");
  const m1=/(\d{1,2})[-\/ ](\d{1,2}|[A-Za-z]{3,9})[-\/ ,]+(\d{4})/.exec(top);
  if(m1){ let mo=+m1[2]; if(!mo){ mo=MON.findIndex(x=>m1[2].slice(0,3).toLowerCase()===x.toLowerCase())+1; } if(mo>0) date=`${m1[3]}-${pad2(mo)}-${pad2(+m1[1])}`; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>TODAY()) date=TODAY();
  return {rows:out,asset,date};
}

  UP.e={who,plat,asset,date}; const cur=SUM(rows,r=>r.cur), inv=SUM(rows,r=>r.inv);
  openE(`<div class="eamt num" style="color:var(--ink)">${money(cur,false)}</div><div class="t">${rows.length} ${asset==="Stocks"?"stocks":"funds"} · ${who}${sp&&asset==="Stocks"?" (in Spardha's account)":""}</div>

async function checkUpdate(manual){ try{ const j=await (await fetch("version.json?t="+Date.now(),{cache:"no-store"})).json();
    if(j.v&&j.v!==APP_VERSION){ $("updTxt").textContent=j.note?`New: ${j.note}`:"A new version is ready"; $("upd").hidden=false; } else if(manual) showToast("You're on the latest version"); }
  catch(e){ if(manual) showToast("Couldn't check, you seem to be offline"); } }
async function doUpdate(){ $("updBtn").textContent="Updating…"; try{ const reg=await navigator.serviceWorker?.getRegistration(); if(reg) await reg.update(); const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){} location.reload(); }
$("updBtn").onclick=doUpdate; $("verBtn").onclick=()=>checkUpdate(true); setTimeout(checkUpdate,2500);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ checkUpdate(); refresh(); if(Date.now()-CACHE_AT>60000) pull(); } });
addEventListener("scroll",()=>document.body.classList.toggle("scrolled",scrollY>8),{passive:true});
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(SC&&isOpen($("scr"))) renderScr(); },200); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
applySkin(store.get("skin","")); refresh(); if(DATA) setSync(OUT.length||HOUT.length?"warn":"",liveLine()); pull();
})();
