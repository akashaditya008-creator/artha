<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=JSON.parse(localStorage.getItem("artha:theme")||"\"\"");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="theme-color" content="#5E1A1F"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Artha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
/* Artha — a pocket bahi-khata: maroon cover band with the portfolio figure, quiet ledger rows below, one dock for adding. */
:root{
  --bg:#F3F3F0; --surface:#FFFFFF; --ink:#1C1A19; --ink2:#4A4643; --muted:#736D68; --line:#E5E2DD; --chip:#ECEAE6;
  --head:#5E1A1F; --head2:#4F161A; --head-ink:#FBF3EE; --head-muted:#DDBDB7; --head-line:rgba(255,255,255,.14);
  --gold:#D9A82E; --gold-ink:#2B1B00; --gain:#18794A; --loss:#C2362F; --warn:#A86A12; --scrim:rgba(24,10,10,.45);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s0:#9C958F;
  --grid:#ECE9E4; --axis:#C9C4BD;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121011; --surface:#1C1919; --ink:#EFEAE7; --ink2:#CFC7C2; --muted:#A39B96; --line:#2E2A29; --chip:#272322;
  --head:#3B1013; --head2:#300D10; --head-ink:#F5E9E4; --head-muted:#C59F99; --head-line:rgba(255,255,255,.10);
  --gold:#E2B444; --gold-ink:#241600; --gain:#4CC27E; --loss:#F07A72; --warn:#E0A84A; --scrim:rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#7D7672;
  --grid:#2A2625; --axis:#3D3836; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121011; --surface:#1C1919; --ink:#EFEAE7; --ink2:#CFC7C2; --muted:#A39B96; --line:#2E2A29; --chip:#272322;
  --head:#3B1013; --head2:#300D10; --head-ink:#F5E9E4; --head-muted:#C59F99; --head-line:rgba(255,255,255,.10);
  --gold:#E2B444; --gold-ink:#241600; --gain:#4CC27E; --loss:#F07A72; --warn:#E0A84A; --scrim:rgba(0,0,0,.6);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#7D7672;
  --grid:#2A2625; --axis:#3D3836; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}

/* cover band */
.cover{background:var(--head);color:var(--head-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px;padding:6px max(6px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px))}
body.scrolled header.top{box-shadow:0 1px 0 var(--head-line)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:inherit}
.ib:active{background:rgba(255,255,255,.10)}
.brand{min-width:0}
.brand h1{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--head-muted);margin-right:6px;vertical-align:1px}
.brand p.live .dot{background:#7FD49E}.brand p.warn .dot{background:var(--gold)}
.acts{display:flex}
#syncBtn.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hero{padding:10px 0 18px}
.hero .hl{margin:0;font-size:13px;color:var(--head-muted)}
.hero .hv{font:600 clamp(38px,11vw,50px)/1.05 var(--display);letter-spacing:-.5px;margin:4px 0 14px;font-variation-settings:"opsz" 96;white-space:nowrap}
.hstats{display:grid;grid-template-columns:1.15fr 1.15fr .8fr;gap:0;border-top:1px solid var(--head-line);padding-top:12px}
.hstats div{min-width:0;padding-right:8px}
.hstats div+div{border-left:1px solid var(--head-line);padding-left:12px}
.hstats small{display:block;font-size:12px;color:var(--head-muted)}
.hstats b{display:block;font:600 17px/1.3 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc{display:flex;gap:2px;height:8px;margin:16px 0 8px;border-radius:999px;overflow:hidden}
.alloc i{display:block;height:100%;min-width:3px}
.hnote{margin:0;font-size:12.5px;color:var(--head-muted)}
.hnote button{color:var(--head-ink);text-decoration:underline;text-underline-offset:3px;font-size:12.5px}

/* view switcher */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px 16px 6px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--ink2);font-weight:600;font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
main{padding:4px 16px 0}
.card{background:var(--surface);border-radius:16px;padding:4px 0;margin:10px 0;box-shadow:0 0 0 1px var(--line)}
.card.cp{padding:14px 16px}
h3.sec{font:600 16px/1.3 var(--display);margin:22px 2px 2px;letter-spacing:.1px}
p.sub{margin:2px 2px 8px;color:var(--muted);font-size:13px}

/* ledger rows */
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.row .ic svg{width:19px;height:19px}
.row .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .rt{text-align:right}
.row .v{font-weight:600;font-size:15px;white-space:nowrap}
.row .x{font-size:12.5px;white-space:nowrap;color:var(--muted);margin-top:1px}
.row .bar{grid-column:2/4;height:4px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:-4px}
.row .bar i{display:block;height:100%;border-radius:999px}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--ink2);vertical-align:1px}
.tag.warn{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--warn)}
.tag.pend{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.stale{color:var(--warn)}
.hint{color:var(--muted);font-size:12.5px;margin:8px 4px}
.expand{padding:0 16px 12px 64px;margin-top:-4px}
.expand .li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0;color:var(--ink2)}

/* chips & segmented */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.chip .sw{width:8px;height:8px;border-radius:50%}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.sm button{padding:6px 4px;font-size:12.5px}

/* charts */
.chart{position:relative;margin:4px 0 0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart text{font:500 10.5px var(--body);fill:var(--muted)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:4px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dotk{border-radius:50%}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45;min-width:120px;max-width:220px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-weight:700}
.tip .tr{display:flex;justify-content:space-between;gap:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl th{font-weight:600;color:var(--muted);font-size:12px}
.linkb{color:var(--ink2);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0}
.stats>div{padding:12px 16px}
.stats>div:nth-child(odd){border-right:1px solid var(--line)}
.stats>div:nth-child(n+3){border-top:1px solid var(--line)}
.stats small{display:block;font-size:12px;color:var(--muted)}
.stats b{display:block;font:600 17px/1.3 var(--body);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats em{display:block;font-style:normal;font-size:12px;color:var(--muted)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.dock button{height:52px;border-radius:16px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.dock .sec2{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.dock .pri{background:var(--gold);color:var(--gold-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 35%,transparent)}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:16;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.upd button{background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}

/* panels (full-screen sheets) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.panel{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.panel .wrap{max-width:560px;margin:0 auto}
.phead{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px}
.phead h2{margin:0;font:600 18px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead a,.phead .lk{font-size:13.5px;font-weight:600;color:var(--ink2);padding:8px 10px;text-decoration:none}
.pbody{padding:0 16px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.actions button{height:44px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:13.5px}
.actions button.pri{background:var(--gold);color:var(--gold-ink);box-shadow:none}
.vhead{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.vhead .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff}
.vhead .big{font:600 30px/1.1 var(--display);letter-spacing:-.3px}
.vhead .lab{font-size:12.5px;color:var(--muted)}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);z-index:45;background:var(--surface);padding:calc(16px + env(safe-area-inset-top,0px)) 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.drawer h2{margin:0;font:600 20px var(--display)}
.drawer .k{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.drawer .lnk{display:block;padding:10px 0;font-weight:600;border-top:1px solid var(--line);text-align:left;width:100%;text-decoration:none}
.drawer .ver{font-size:12.5px;color:var(--muted)}

/* add flow */
.abody{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.adate{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;position:relative}
.adate input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.adate svg{width:18px;height:18px}
.aval{font:600 44px/1.1 var(--display);text-align:center;padding:14px 8px 6px;letter-spacing:-.5px;overflow-wrap:anywhere}
.aval.zero{color:var(--muted)}
.awords{text-align:center;color:var(--muted);font-size:13px;min-height:18px;margin-top:-6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:56px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:600 22px var(--body)}
.pad button:active{background:var(--chip)}
.pad .choose{grid-column:1/-1;background:var(--ink);color:var(--bg);box-shadow:none;font-size:16px;height:54px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cg{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left;min-height:96px}
.cg .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff}
.cg .ic svg{width:18px;height:18px}
.cg b{font-weight:600;font-size:14px;line-height:1.25}
.cg small{color:var(--muted);font-size:12px;margin-top:-4px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld textarea,.gate input{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface);color:var(--ink);width:100%}
.fld textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.savebar{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,transparent)}
.savebar button{width:100%;height:54px;border-radius:16px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:16px}
.err{color:var(--loss);font-size:13.5px;min-height:0}
.err:empty{display:none}
.catpick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);width:100%;text-align:left}
.catpick .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}
.catpick .ic svg{width:16px;height:16px}
.catpick .cl{flex:1;font-weight:600}
.catpick small{color:var(--muted)}

/* entry popup, gate, toast */
.pop{position:fixed;inset:0;z-index:50;display:grid;align-items:end;justify-items:center;background:var(--scrim)}
.pop .box{width:min(560px,100%);background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.pop .amt{font:600 30px var(--display)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 16px;font-size:14px}
.pop dt{color:var(--muted)} .pop dd{margin:0;overflow-wrap:anywhere}
.pop .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop .btns a,.pop .btns button{height:46px;border-radius:12px;display:grid;place-items:center;font-weight:600;background:var(--chip);text-decoration:none}
.gate{position:fixed;inset:0;z-index:60;background:var(--head);color:var(--head-ink);display:grid;place-items:center;padding:24px}
.gate form{display:grid;gap:12px;width:min(340px,100%)}
.gate .logo{width:64px;height:64px;border-radius:16px}
.gate h2{margin:0;font:700 28px var(--display)}
.gate p{margin:0;color:var(--head-muted)}
.gate input{box-shadow:none}
.gate button{height:50px;border-radius:14px;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:16px}
.gate .err{color:#FFC9C2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.mask .money{letter-spacing:1px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){ .panel .wrap{padding-top:8px} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.6C3.9 8.3 2 12 2 12s3.6 6 10 6c1.6 0 3-.3 4.3-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>

<script>
(()=>{
"use strict";
const APP_VERSION="1.0";
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem("artha:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("artha:"+k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- endpoint: comes only from the private setup link, never from this public code ---------- */
function takeLink(s){ const m=/[#&?]k=([\w-]{20,})/.exec(s||"")||/\/macros\/s\/([\w-]{20,})\//.exec(s||""); if(!m) return false; store.set("api","https://script.google.com/macros/s/"+m[1]+"/exec"); return true; }
if(takeLink(location.hash)) history.replaceState(null,"",location.pathname+location.search);
const API=()=>store.get("api",""), PW=()=>store.get("pass","");
function call(action,extra){
  return fetch(API(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,pass:PW()},extra||{}))})
    .then(r=>r.json(),()=>{ const x=new Error("Couldn't reach Google just now. Check your internet."); x.net=true; throw x; })
    .then(r=>{ if(r&&r.ok) return r.d; throw new Error((r&&r.m)||"Couldn't reach the sheet."); });
}

/* ---------- dates & money ---------- */
const pad2=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const TODAY=()=>isoOf(new Date());
const dOf=s=>new Date(s+"T00:00:00");
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=s=>{ if(!s) return "No date"; const d=dOf(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDs=s=>{ const d=dOf(s); return `${d.getDate()} ${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; };
const days=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5);
const addMonths=(s,n)=>{ const d=dOf(s); d.setMonth(d.getMonth()+n); return isoOf(d); };
let HIDE=store.get("hide",false), SHORT=store.get("amt","full")==="short";
function rs(n,short){ const a=Math.abs(n), s=n<0?"−":"";
  if(short||SHORT&&short!==false){ const f=(x,dp)=>String(parseFloat(x.toFixed(dp)));
    if(a>=1e7) return s+"₹"+f(a/1e7,2)+"Cr"; if(a>=1e5) return s+"₹"+f(a/1e5,a>=1e6?1:2)+"L"; if(a>=1e3) return s+"₹"+f(a/1e3,a>=1e4?0:1)+"K"; return s+"₹"+Math.round(a); }
  return s+"₹"+Math.round(a).toLocaleString("en-IN"); }
const money=(n,short)=>HIDE?'<span class="money">₹••••</span>':esc(rs(n,short));
const smoney=(n,short)=>HIDE?'<span class="money">₹••••</span>':esc((n>0?"+":"")+rs(n,short));
const pct=x=>x==null||!isFinite(x)?"—":(x*100).toFixed(Math.abs(x)>=1?0:1)+"%";
const cls=n=>n>0?"gain":n<0?"loss":"";
const words=n=>{ if(!n) return ""; if(n>=1e7) return (n/1e7).toFixed(2).replace(/\.?0+$/,"")+" crore"; if(n>=1e5) return (n/1e5).toFixed(2).replace(/\.?0+$/,"")+" lakh"; if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"")+" thousand"; return ""; };

/* ---------- XIRR: money out of pocket negative, money back or value positive ---------- */
function xirr(flows){
  const f=flows.filter(x=>x[0]&&x[1]).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  if(f.length<2||!f.some(x=>x[1]>0)||!f.some(x=>x[1]<0)) return null;
  const t0=dOf(f[0][0]).getTime(), g=f.map(x=>[(dOf(x[0]).getTime()-t0)/864e5/365,x[1]]);
  if(g[g.length-1][0]<0.02) return null;
  const npv=r=>g.reduce((s,x)=>s+x[1]/Math.pow(1+r,x[0]),0);
  let lo=-0.9999,hi=10,flo=npv(lo),fhi=npv(hi);
  for(let k=0;k<60&&flo*fhi>0;k++){ hi*=2; fhi=npv(hi); if(hi>1e6) return null; }
  if(flo*fhi>0) return null;
  for(let k=0;k<200;k++){ const m=(lo+hi)/2,fm=npv(m); if(Math.abs(fm)<1e-7||hi-lo<1e-10) return m; if(fm*flo<0){hi=m;fhi=fm;} else {lo=m;flo=fm;} }
  return (lo+hi)/2;
}

/* ---------- categories, types, platforms ---------- */
const META={
  "Stocks (Main)":{short:"Stocks (Main)",slot:1,icon:"trend",types:["Stocks","MF"]},
  "Pikul – Spardha Account":{short:"Pikul (Spardha A/c)",slot:2,icon:"wallet",types:["Stocks","US Stocks","MF","Bond"]},
  "Mutual Funds":{short:"Mutual Funds",slot:3,icon:"pie",types:["MF","ELSS"]},
  "Bonds":{short:"Bonds",slot:4,icon:"bond",types:["Bond"]},
  "Spardha (Own)":{short:"Spardha (Own)",slot:5,icon:"leaf",types:["MF","Stocks"]},
  "NPS":{short:"NPS",slot:6,icon:"sun",types:["NPS"]},
  "Term Insurance":{short:"Term insurance",slot:0,icon:"shield",types:[]}
};
const meta=n=>META[n]||{short:n,slot:7,icon:"dot",types:[]};
const col=slot=>`var(--s${slot})`;
const icon=(n,c)=>`<span class="ic" style="background:${c}"><svg class="i"><use href="#i-${n}"/></svg></span>`;
const TG=t=>{ const s=String(t||"").toLowerCase(); if(s==="mf"||s==="elss"||s.includes("mutual")) return "Mutual Funds"; if(s.startsWith("us")) return "US Stocks";
  if(s==="stocks"||s==="equity"||s==="stock") return "Stocks"; if(s.startsWith("bond")) return "Bonds"; if(s==="nps") return "NPS"; return t||"Other"; };
const TSLOT={"Stocks":1,"Mutual Funds":3,"Bonds":4,"US Stocks":7,"NPS":6};
const PSLOT=["Groww","Wint Wealth","Stable Money","Grip Invest","INDmoney"];

/* ---------- state ---------- */
let DATA=store.get("cache",null), CACHE_AT=store.get("cacheAt",0), OUT=store.get("outbox",[]);
let VIEW=store.get("view","cat"), M=null;
const saveOut=()=>store.set("outbox",OUT);

function build(){
  const D=DATA||{cats:[],tx:[],vals:[]};
  const cats=D.cats.map(c=>Object.assign({},c,meta(c.name)));
  let tx=D.tx.map(r=>({cat:r[0],date:r[1],amt:r[2],type:r[3],plat:r[4],name:r[5],note:r[6],row:r[7],bid:r[8],mat:r[9],exp:r[10]}));
  let vals=D.vals.map(r=>({cat:r[0],date:r[1],value:r[2],note:r[3],row:r[4]}));
  for(const o of OUT){ const p=o.p;
    if(o.kind==="add") tx.push({cat:p.cat,date:p.date,amt:p.kind==="out"?-p.amount:p.amount,type:p.type||(cats.find(c=>c.name===p.cat)||{}).def||"",plat:p.plat||"",name:p.name||"",note:p.note||"",row:0,bid:p.bid||"",mat:p.mat||"",exp:+p.exp||0,pending:1});
    else { vals=vals.filter(v=>!(v.cat===p.cat&&v.date===p.date)); vals.push({cat:p.cat,date:p.date,value:p.value,note:"",row:0,pending:1}); } }
  tx.forEach((t,i)=>{ t.i=i; t.g=TG(t.type); t.p=t.plat||"Not recorded"; });
  const today=TODAY();
  const C=cats.map(c=>{
    const T=tx.filter(t=>t.cat===c.name), V=vals.filter(v=>v.cat===c.name).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.row-b.row);
    const inv=T.filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0), out=-T.filter(t=>t.amt<0).reduce((s,t)=>s+t.amt,0), net=inv-out;
    const lv=V[V.length-1]||null, dated=T.filter(t=>t.date);
    const firstD=dated.reduce((m,t)=>!m||t.date<m?t.date:m,""), lastIn=dated.filter(t=>t.amt>0).reduce((m,t)=>!m||t.date>m?t.date:m,"");
    const s={...c,T,V,inv,out,net,lv,firstD,lastIn,n:T.length};
    if(!c.protect&&lv){
      const upto=dated.filter(t=>t.date<=lv.date), since=dated.filter(t=>t.date>lv.date).reduce((a,t)=>a+t.amt,0);
      s.netAt=upto.reduce((a,t)=>a+t.amt,0); s.gain=lv.value-s.netAt; s.since=since; s.cur=lv.value+since;
      s.flows=upto.map(t=>[t.date,-t.amt]).concat([[lv.date,lv.value]]); s.x=xirr(s.flows);
      s.age=days(lv.date,today); s.stale=s.age>45||Math.abs(since)>0;
    } else { s.cur=net; s.gain=null; s.x=null; s.flows=null; s.stale=!c.protect; }
    return s;
  });
  const I=C.filter(c=>!c.protect), valued=I.filter(c=>c.lv);
  const P={cur:I.reduce((a,c)=>a+c.cur,0),net:I.reduce((a,c)=>a+c.net,0),inv:I.reduce((a,c)=>a+c.inv,0),out:I.reduce((a,c)=>a+c.out,0),
    gain:valued.reduce((a,c)=>a+c.gain,0),valued:valued.length,total:I.length,
    x:xirr([].concat(...valued.map(c=>c.flows)))};
  M={cats:C,inv:I,tx,vals,P,today,url:D.url||""};
}

/* ---------- hero ---------- */
function renderHero(){
  const P=M.P;
  document.body.classList.toggle("mask",HIDE);
  $("heroLabel").textContent=P.valued?"Current value":"Net invested";
  $("heroVal").innerHTML=money(P.valued?P.cur:P.net,false);
  $("hNet").innerHTML=money(P.net,true);
  $("hGain").innerHTML=P.valued?smoney(P.gain,true):"—";
  $("hX").textContent=P.valued?pct(P.x):"—";
  const tot=M.inv.reduce((a,c)=>a+Math.max(0,c.cur),0)||1;
  $("alloc").innerHTML=M.inv.filter(c=>c.cur>0).sort((a,b)=>b.cur-a.cur).map(c=>`<i style="width:${(c.cur/tot*100).toFixed(2)}%;background:${col(c.slot)}" title="${esc(c.short)}"></i>`).join("");
  const stale=M.inv.filter(c=>c.stale).length;
  $("hNote").innerHTML=!M.inv.length?"":P.valued===P.total
    ? (stale?`${stale} ${stale>1?"values are":"value is"} out of date. <button type="button" id="hUpd">Update</button>`:"Every category has a recent value.")
    : `XIRR and gain cover ${P.valued} of ${P.total} categories. The rest count at cost until you add today's value. <button type="button" id="hUpd">Add values</button>`;
  const b=$("hUpd"); if(b) b.onclick=()=>openAdd("val");
}

/* ---------- views ---------- */
function renderView(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===VIEW)));
  const v=$("view");
  if(!M.cats.length){ v.innerHTML=`<div class="empty">${DATA?"No investments found in the sheet.":"Loading your investments…"}</div>`; return; }
  ({cat:viewCats,type:()=>viewGroup("g"),plat:()=>viewGroup("p"),time:viewTime,size:viewSize}[VIEW]||viewCats)(v);
}
function catRow(c,max){
  const sub=c.protect?`${c.T.length} premiums paid`
    : c.lv?`<span class="${cls(c.gain)}">${smoney(c.gain,true)}</span> gain${c.stale?` <span class="tag warn">value ${c.age>45?fmtDs(c.lv.date):"needs update"}</span>`:""}`
    : `At cost <span class="tag warn">no value yet</span>`;
  const right=c.protect?`<div class="v num">${money(c.inv,true)}</div><div class="x">paid so far</div>`
    : `<div class="v num">${money(c.cur,true)}</div><div class="x">${c.lv?`XIRR <b class="${cls(c.x)}">${pct(c.x)}</b>`:`Net ${money(c.net,true)}`}</div>`;
  return `<button class="row" data-cat="${esc(c.name)}">${icon(c.icon,col(c.slot))}<div style="min-width:0"><div class="nm">${esc(c.short)}</div><div class="ds">${sub}</div></div><div class="rt">${right}</div>
    ${max?`<div class="bar"><i style="width:${Math.max(1,c.cur/max*100).toFixed(1)}%;background:${col(c.slot)}"></i></div>`:""}</button>`;
}
function viewCats(v){
  const I=M.inv.slice().sort((a,b)=>b.cur-a.cur), max=Math.max(...I.map(c=>c.cur),1), prot=M.cats.filter(c=>c.protect);
  v.innerHTML=`<div class="card">${I.map(c=>catRow(c,max)).join("")}</div>
    ${prot.length?`<h3 class="sec">Protection</h3><p class="sub">Not counted in your portfolio value.</p><div class="card">${prot.map(c=>catRow(c,0)).join("")}</div>`:""}
    ${upcomingHTML()}${insightsHTML()}`;
  v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>openCat(b.dataset.cat));
  v.querySelectorAll("[data-valcat]").forEach(b=>b.onclick=()=>openAdd("val",b.dataset.valcat||null));
  v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>openCat(b.dataset.goto));
  bindEntries(v);
}
function groupsOf(tx,key){
  const m=new Map(); for(const t of tx){ const k=t[key]; if(!m.has(k)) m.set(k,{k,inv:0,out:0,n:0,last:"",cats:new Map()}); const g=m.get(k);
    if(t.amt>0){g.inv+=t.amt; g.n++; if(t.date>g.last) g.last=t.date;} else g.out-=t.amt; g.cats.set(t.cat,(g.cats.get(t.cat)||0)+t.amt); }
  return [...m.values()].map(g=>({...g,net:g.inv-g.out})).sort((a,b)=>b.net-a.net);
}
let OPEN_G=null;
function viewGroup(key){
  const v=$("view"), invCats=new Set(M.inv.map(c=>c.name)), tx=M.tx.filter(t=>invCats.has(t.cat));

let TF=store.get("tf","All"), GRAIN=store.get("grain","FY"), SHOWT=false;
function fyOf(s){ const y=+s.slice(0,4),m=+s.slice(5,7); return m>=4?y:y-1; }
function pkey(s,g){ const y=+s.slice(0,4),m=+s.slice(5,7);
  if(g==="M") return s.slice(0,7); if(g==="Y") return String(y);
  const fy=fyOf(s); if(g==="FY") return "FY"+fy; return "FY"+fy+"Q"+(Math.floor(((m+8)%12)/3)+1); }
function plabel(k,g,short){
  if(g==="M"){ const [y,m]=k.split("-"); return short?`${MON[+m-1]} ${y.slice(2)}`:`${MON[+m-1]} ${y}`; }
  if(g==="Y") return short?"'"+k.slice(2):k;
  const fy=+k.slice(2,6); const base=`FY${String(fy+1).slice(2)}`; if(g==="FY") return short?base:`FY ${fy}-${String(fy+1).slice(2)}`;
  return short?`Q${k.slice(-1)}`:`${base} Q${k.slice(-1)} (${["Apr–Jun","Jul–Sep","Oct–Dec","Jan–Mar"][+k.slice(-1)-1]})`; }
function periods(tx,g){
  const dated=tx.filter(t=>t.date); if(!dated.length) return [];
  const first=dated.reduce((m,t)=>t.date<m?t.date:m,dated[0].date), keys=[]; let d=first.slice(0,7)+"-01";
  const end=TODAY(); while(d<=end){ const k=pkey(d,g); if(keys[keys.length-1]!==k) keys.push(k); d=addMonths(d,1); }
  const lim={M:24,Q:16,FY:99,Y:99}[g]; const ks=keys.slice(-lim), map=new Map(ks.map(k=>[k,{k,inv:0,out:0,n:0}]));
  for(const t of dated){ const p=map.get(pkey(t.date,g)); if(!p) continue; if(t.amt>0){p.inv+=t.amt;p.n++;} else p.out-=t.amt; }
  return [...map.values()];
}
function nice(v){ if(v<=0) return 0; const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
function roundRect(x,y,w,h,r,up){ r=Math.min(r,w/2,h); if(h<=0) return ""; return up
  ?`M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`
  :`M${x},${y}V${y+h-r}Q${x},${y+h} ${x+r},${y+h}H${x+w-r}Q${x+w},${y+h} ${x+w},${y+h-r}V${y}Z`; }
function tipAt(wrap,x,y,html){ let t=wrap.querySelector(".tip"); if(!t){ t=document.createElement("div"); t.className="tip"; wrap.appendChild(t); }
  t.innerHTML=html; t.hidden=false; const W=wrap.clientWidth, tw=t.offsetWidth; t.style.left=Math.max(0,Math.min(W-tw,x-tw/2))+"px"; t.style.top=Math.max(0,y-t.offsetHeight-10)+"px"; }
function hideTip(wrap){ const t=wrap.querySelector(".tip"); if(t) t.hidden=true; }
function barChart(wrap,P,g){

function lineChart(wrap,tx,vals,color){
  const dated=tx.filter(t=>t.date).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); if(!dated.length){ wrap.innerHTML=""; return; }

  const t0=dOf(pts[0][0]).getTime(), t1=dOf(TODAY()).getTime(), tx_=s=>pl+(dOf(s).getTime()-t0)/Math.max(1,t1-t0)*(W-pl-pr);
  const ymax=nice(Math.max(...pts.map(p=>p[1]),...vals.map(v=>v.value),1)), ymin=Math.min(0,...pts.map(p=>p[1])), y=v=>pt+(ymax-v)/((ymax-ymin)||1)*(H-pt-pb);
  let d=`M${tx_(pts[0][0])},${y(0)}`; pts.forEach(p=>{ d+=`H${tx_(p[0]).toFixed(1)}V${y(p[1]).toFixed(1)}`; }); d+=`H${W-pr}`;

  const y0=+pts[0][0].slice(0,4), y1=+TODAY().slice(0,4), st=Math.max(1,Math.ceil((y1-y0+1)/6));

  s+=`<path class="ln" d="${d}" stroke="${color}"/>`;
  vals.forEach(v=>{ s+=`<circle cx="${tx_(v.date)}" cy="${y(v.value)}" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`; });
  s+=`<line class="cross" id="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"/></svg>`;
  wrap.innerHTML=s;
  const sv=wrap.querySelector("svg"), xh=sv.querySelector("#xh");
  const hit=e=>{ const r=wrap.getBoundingClientRect(), px=(e.clientX-r.left)*(W/r.width); if(px<pl){ hideTip(wrap); xh.setAttribute("visibility","hidden"); return; }
    const tt=t0+(px-pl)/(W-pl-pr)*(t1-t0), iso=isoOf(new Date(tt)); let cur=0; for(const p of pts){ if(p[0]<=iso) cur=p[1]; }

    tipAt(wrap,px*(r.width/W),(y(cur)/H)*r.height,`<b>${fmtD(near?near.date:iso)}</b><div class="tr"><span>Net invested</span><span>${money(cur)}</span></div>${near?`<div class="tr"><span>Value</span><span>${money(near.value)}</span></div>`:""}`); };
  sv.addEventListener("pointerdown",hit); sv.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"||e.buttons) hit(e); });
  sv.addEventListener("pointerleave",()=>{ hideTip(wrap); xh.setAttribute("visibility","hidden"); });

/* ---------- coming up & insights ---------- */
function bondsOf(tx){ // active and ended bonds across categories
  const ended=new Set(tx.filter(t=>t.amt<0&&t.g==="Bonds").map(t=>t.cat+"|"+t.name));
  return tx.filter(t=>t.amt>0&&t.g==="Bonds").map(t=>({...t,ended:ended.has(t.cat+"|"+t.name)}));
}
function nextPremium(c){
  const paid=c.T.filter(t=>t.date).sort((a,b)=>a.date<b.date?-1:1), last=paid[paid.length-1]; if(!last) return null;
  const y=+last.date.slice(0,4), cand=[`${y-1}-08-01`,`${y}-02-01`,`${y}-08-01`,`${y+1}-02-01`];
  const due=cand.reduce((b,d)=>Math.abs(days(d,last.date))<Math.abs(days(b,last.date))?d:b,cand[0]);
  return {date:addMonths(due,6),amt:c.T[c.T.length-1].amt,left:60-c.T.length};
}
function elss(){
  const lots=M.tx.filter(t=>t.amt>0&&String(t.type).toUpperCase()==="ELSS"&&t.date); if(!lots.length) return null;
  const today=TODAY(), lock=lots.filter(t=>addMonths(t.date,36)>today), free=lots.filter(t=>addMonths(t.date,36)<=today);
  const next=lock.map(t=>addMonths(t.date,36)).sort()[0];
  return {free:free.reduce((a,t)=>a+t.amt,0),locked:lock.reduce((a,t)=>a+t.amt,0),next,nextAmt:lock.filter(t=>addMonths(t.date,36)===next).reduce((a,t)=>a+t.amt,0)};
}
function upcomingHTML(){
  const items=[], today=TODAY();
  bondsOf(M.tx).filter(b=>!b.ended&&b.mat&&b.mat>=today).sort((a,b)=>a.mat<b.mat?-1:1).slice(0,3).forEach(b=>{
    const m=Math.max(0,Math.round(days(today,b.mat)/30.4));
    items.push(`<button class="row" data-i="${b.i}" style="grid-template-columns:auto 1fr auto">${icon("bond",col(4))}<div style="min-width:0"><div class="nm">${esc(b.name||"Bond")}</div><div class="ds">Ends ${fmtD(b.mat)}, in ${m} month${m===1?"":"s"}</div></div><div class="rt"><div class="v num">${b.exp?money(b.exp,true):"—"}</div><div class="x">expected back</div></div></button>`); });
  const term=M.cats.find(c=>c.protect); const np=term&&nextPremium(term);
  if(np) items.push(`<div class="row" style="grid-template-columns:auto 1fr auto">${icon("shield",col(0))}<div style="min-width:0"><div class="nm">Term premium due</div><div class="ds">${fmtD(np.date)}, ${np.left} instalments left</div></div><div class="rt"><div class="v num">${money(np.amt)}</div><div class="x">last paid</div></div></div>`);
  const e=elss(); if(e&&e.locked) items.push(`<div class="row" style="grid-template-columns:auto 1fr auto">${icon("pie",col(3))}<div style="min-width:0"><div class="nm">ELSS lock-in</div><div class="ds">${money(e.nextAmt,true)} frees up on ${fmtD(e.next)}</div></div><div class="rt"><div class="v num">${money(e.locked,true)}</div><div class="x">still locked</div></div></div>`);
  const st=M.inv.filter(c=>c.stale);

function saveEntry(){
  const c=M.cats.find(x=>x.name===A.cat), d=A.det, isBond=TG(d.type)==="Bonds"||A.cat==="Bonds";
  if(A.mode==="in"&&isBond&&d.mat&&d.mat<=A.date){ $("dErr").textContent="The end date should be after the purchase date."; return; }
  const p={cat:A.cat,kind:A.mode,date:A.date,amount:amtNum(),type:(c.fields||[]).includes("type")?d.type||"":"",plat:d.plat||"",name:(d.name||"").trim(),note:(d.note||"").trim(),
    bid:isBond?(d.bid||"").trim():"",mat:isBond&&A.mode==="in"?(d.mat||""):"",exp:isBond&&A.mode==="in"?Number(String(d.exp||"").replace(/[^\d.]/g,""))||"":"",rid:rid()};
  OUT.push({kind:"add",p}); saveOut(); ov.back(); refresh();
  showToast(`${A.mode==="out"?"Withdrawal":"Investment"} of ${rs(p.amount)} saved to ${meta(p.cat).short}`); flush();
}
function saveValue(){
  const p={cat:A.cat,date:A.date,value:amtNum(),rid:rid()};
  OUT.push({kind:"value",p}); saveOut(); ov.back(); refresh();
  const c=M.cats.find(x=>x.name===p.cat); showToast(`Value saved for ${meta(p.cat).short}.${c&&c.x!=null?` XIRR ${pct(c.x)}`:""}`); flush();
}

/* ---------- sync ---------- */
let loading=false, flushing=false;
function setSync(kind,txt){ $("syncTxt").className=kind; $("syncMsg").textContent=txt; }
const fmtWhen=t=>{ if(!t) return "never"; const m=Math.round((Date.now()-t)/6e4); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"}); };
function liveLine(){ return `Synced ${fmtWhen(CACHE_AT)}`+(OUT.length?`, ${OUT.length} waiting`:""); }
function applyData(d){ DATA=d; CACHE_AT=Date.now(); store.set("cache",d); store.set("cacheAt",CACHE_AT); refresh(); setSync(OUT.length?"warn":"live",liveLine()); }
function errText(e){ const m=String(e&&e.message||e||"");
  if(/PASSCODE/.test(m)){ store.set("pass",""); askPass("Wrong passcode. 3 wrong tries lock Artha for 3 hours."); return "Passcode needed."; }
  if(/Locked/.test(m)){ if(!$("gate").hidden) $("gErr").textContent=m; return m; }
  return m||"Couldn't reach Google just now."; }
function flush(){ if(flushing||!OUT.length||!PW()||!API()) return; flushing=true; const it=OUT[0];
  call(it.kind==="add"?"add":"value",{e:it.p}).then(d=>{ flushing=false; OUT.shift(); saveOut(); applyData(d); flush(); },x=>{ flushing=false; const m=String(x&&x.message||x);
    if(x&&x.net){ setSync("warn",`Offline, ${OUT.length} waiting to sync`); return; }
    if(/PASSCODE|Locked/.test(m)){ setSync("warn",errText(x)); return; }
    OUT.shift(); saveOut(); refresh(); showToast(`Not saved: ${rs(it.p.amount||it.p.value||0)} for ${meta(it.p.cat).short}. ${m}`,7000); setSync("warn",`One change wasn't saved: ${m}`); flush(); }); }
addEventListener("online",()=>{ flush(); pull(); });
function pull(){ if(loading) return; if(!API()){ askPass(null,true); return; } if(!PW()){ askPass(); return; } flush(); loading=true; $("syncBtn").classList.add("spin");
  setSync("",DATA?`Showing copy from ${fmtWhen(CACHE_AT)}, updating…`:"Loading your sheet…");
  call("get").then(d=>{ loading=false; $("syncBtn").classList.remove("spin"); applyData(d); flush(); },e=>{ loading=false; $("syncBtn").classList.remove("spin"); const m=errText(e);
    setSync("warn",e&&e.net&&DATA?`Offline copy from ${fmtWhen(CACHE_AT)}`+(OUT.length?`, ${OUT.length} waiting`:""):m); }); }
function askPass(msg,needLink){ const need=needLink||!API(); $("gLink").hidden=!need; $("gMsg").textContent=need?"Open the private setup link once, or paste it here with the family passcode.":"Enter the family passcode (once on this phone).";
  $("gErr").textContent=msg||""; $("gate").hidden=false; setTimeout(()=>(need?$("gLink"):$("gIn")).focus(),50); }
$("gForm").addEventListener("submit",e=>{ e.preventDefault(); if(!$("gLink").hidden){ if(!takeLink($("gLink").value)){ $("gErr").textContent="That doesn't look like the Artha setup link."; return; } }
  const v=$("gIn").value.trim(); if(!v){ $("gErr").textContent="Enter the passcode."; return; } store.set("pass",v); $("gate").hidden=true; $("gIn").value=""; pull(); });

/* ---------- chrome ---------- */
let tt; function showToast(t,ms){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,ms||2800); }
function refresh(){ build(); renderHero(); renderView(); if(!$("catPanel").hidden) renderCat(); if(!$("entPanel").hidden) renderEntries(); $("sheetLink").href=M.url||"#"; }
$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.v; store.set("view",VIEW); renderView(); b.scrollIntoView({inline:"nearest",block:"nearest"}); });
$("addBtn").onclick=()=>openAdd("in"); $("valBtn").onclick=()=>openAdd("val");
$("syncBtn").onclick=pull;
$("searchBtn").onclick=()=>{ ECAT="All"; EK="all"; $("q").value=""; renderEntries(); ov.open($("entPanel"),()=>{$("entPanel").hidden=true;}); };
$("q").addEventListener("input",renderEntries);
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>ov.back());
$("pop").addEventListener("click",e=>{ if(e.target===$("pop")) ov.back(); });
function eye(){ $("eyeBtn").setAttribute("aria-pressed",String(HIDE)); $("eyeBtn").setAttribute("aria-label",HIDE?"Show amounts":"Hide amounts"); $("eyeBtn").querySelector("use").setAttribute("href",HIDE?"#i-eyeoff":"#i-eye"); }
$("eyeBtn").onclick=()=>{ HIDE=!HIDE; store.set("hide",HIDE); eye(); refresh(); }; eye();
$("menuBtn").onclick=()=>{ $("scrim").hidden=false; ov.open($("drawer"),()=>{ $("drawer").hidden=true; $("scrim").hidden=true; }); };
$("scrim").onclick=()=>ov.back();
function drawerState(){ const t=store.get("theme",""); $("fTheme").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===t)));
  $("fAmt").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.a==="short")===SHORT))); }
$("fTheme").querySelectorAll("button").forEach(b=>b.onclick=()=>{ store.set("theme",b.dataset.t); if(b.dataset.t) document.documentElement.setAttribute("data-theme",b.dataset.t); else document.documentElement.removeAttribute("data-theme"); drawerState(); refresh(); });
$("fAmt").querySelectorAll("button").forEach(b=>b.onclick=()=>{ SHORT=b.dataset.a==="short"; store.set("amt",b.dataset.a); drawerState(); refresh(); });
drawerState();
$("forgetBtn").onclick=()=>{ if(OUT.length){ showToast(`${OUT.length} changes still waiting to sync. Go online first.`,4000); return; } ["api","pass","cache","cacheAt","outbox"].forEach(k=>{ try{localStorage.removeItem("artha:"+k);}catch(e){} }); location.reload(); };
$("verTxt").textContent="Version "+APP_VERSION;
async function checkUpdate(manual){ try{ const j=await (await fetch("version.json?t="+Date.now(),{cache:"no-store"})).json();
    if(j.v&&j.v!==APP_VERSION){ $("updTxt").textContent=j.note?`New version: ${j.note}`:"A new version is ready"; $("upd").hidden=false; } else if(manual) showToast("You're on the latest version"); }
  catch(e){ if(manual) showToast("Couldn't check, you seem to be offline"); } }
async function doUpdate(){ $("updBtn").textContent="Updating…"; try{ const reg=await navigator.serviceWorker?.getRegistration(); if(reg) await reg.update(); const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){} location.reload(); }
$("updBtn").onclick=doUpdate; $("verBtn").onclick=()=>checkUpdate(true);
setTimeout(checkUpdate,2500);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ checkUpdate(); if(Date.now()-CACHE_AT>60000) pull(); } });
addEventListener("scroll",()=>document.body.classList.toggle("scrolled",scrollY>8),{passive:true});
let rz; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(VIEW==="time") renderView(); if(!$("catPanel").hidden) renderCat(); },200); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
refresh(); if(DATA) setSync(OUT.length?"warn":"",liveLine()); pull();
})();
</script>
</body></html>
