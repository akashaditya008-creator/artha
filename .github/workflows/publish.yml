# Every push to main is checked first; only a build that passes tools/check.py is published to GitHub Pages.
name: Check and publish
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Release check (blocks publishing if anything fails)
        run: CHROME="$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" python tools/check.py
      - name: Package the site (app files only)
        run: |
          mkdir _site
          cp index.html app.js app.css scene.js sw.js three.min.js manifest.webmanifest version.json icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
